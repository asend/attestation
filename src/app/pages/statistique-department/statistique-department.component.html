<button class="btn btn-success m-3">
  <a routerLink="/statistiques" style="color: white;">statistiques</a>
</button>

<div class="container my-5">

  <!-- Selecteur Global -->
  <div class="row my-4">
    <div class="col-12">
      <label for="regionSelect" class="form-label fw-bold">Choisir une région :</label>
      <select class="form-select w-auto" id="regionSelect" [(ngModel)]="selectedRegion">
        <option *ngFor="let region of regions" [ngValue]="region">{{ region }}</option>
      </select>
    </div>
  </div>

  <!-- DAKAR -->
<div class="row" *ngIf="selectedRegion === 'Dakar'">
  <div class="col-12">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      LA RÉGION DAKAR
      <select class="form-select w-auto" [(ngModel)]="selectedChartType">
        <option value="bar">Bar</option>
        <option value="pie">Pie</option>
        <option value="line">Line</option>
      </select>
    </div>
    <div class="card shadow rounded">
      <highcharts-chart 
        [Highcharts]="Highcharts"
        [options]="getChartOptionsByTypeDakar(selectedChartType)"
        [update]="updateFlag"
        style="width: 100%; height: 500px; display: block;">
      </highcharts-chart>
    </div>
  </div>
</div>

  <!-- DIOURBEL -->
